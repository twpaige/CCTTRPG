<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeFlow</title>
<style>
:root{color-scheme:dark;--bg:#111;--panel:#191919;--line:#383838;--ink:#eee;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Consolas,monospace}
.shell{width:min(900px,calc(100% - 32px));margin:auto;padding:35px 0 60px}
header{text-align:center;margin-bottom:22px}h1{font:300 clamp(36px,7vw,64px)/1.15 system-ui,sans-serif;letter-spacing:.12em;margin:0}
.version{font:12px system-ui,sans-serif;color:#888;margin:5px 0}.tagline{font:14px system-ui,sans-serif;color:var(--muted);margin:7px 0}
.notice{border:1px solid #5d533e;color:#d6c69d;padding:10px 12px;margin:15px 0;font-size:13px}
.nav,.folderbar,.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;justify-content:center;margin:12px 0}
button{font:inherit;background:#222;border:1px solid #555;border-radius:3px;color:#eee;padding:7px 13px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}button[aria-pressed=true]{border-color:#ddd;background:#333}
button:hover:not(:disabled){background:#333}
.footer-folder{background:none;border:0;padding:0;color:#aaa;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.footer-folder:hover:not(:disabled){background:none;color:#eee}
.footer-folder:disabled{opacity:.5}
.topline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:18px 0 10px}
#state{color:#eee}.writing-surface{position:relative;height:290px;overflow:hidden;cursor:text}
.writing-display{position:absolute;inset:0;padding:20px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-all;font:18px/1.7 Consolas,monospace;pointer-events:none;scrollbar-width:none}
.writing-display::-webkit-scrollbar{display:none}.caret{display:inline-block;width:2px;height:1.1em;vertical-align:-.18em;background:#eee;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}.placeholder{color:#666}
.editor{position:absolute;inset:0;width:100%;height:100%;opacity:0;resize:none;outline:0;border:0;cursor:text}
.hint{font-size:13px;color:var(--muted);min-height:25px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{border:1px solid var(--line);background:var(--panel);padding:12px;text-align:center}
.stat strong{display:block;font-size:23px;font-weight:400}.stat span{font-size:12px;color:var(--muted)}
.settings{border-top:1px solid var(--line);padding-top:15px;margin-top:22px}
h2{font-size:16px;font-weight:400}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
label{font-size:13px;color:var(--muted)}input[type=range]{width:100%;accent-color:#ccc;display:block;margin:10px 0}
.archive{border:1px solid var(--line);padding:18px;background:var(--panel);min-height:250px}
.archive input{background:#111;color:#eee;border:1px solid #555;font:inherit;width:100%;padding:10px}
.archive-list{margin:12px 0;max-height:450px;overflow:auto}
.entry{display:flex;align-items:baseline;gap:18px;overflow:hidden}
.entry-name{flex:0 0 auto;white-space:nowrap}
.entry-preview{flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager{display:flex;align-items:center;gap:14px;margin:14px 0;justify-content:space-between}
.pager-center{flex:1;text-align:center;min-width:90px}
.pager-center input{display:block;width:100%;padding:0;margin:0;accent-color:#ccc}
.pager-center output{display:block;font-size:12px;color:var(--muted);margin-top:5px}.entry{display:block;width:100%;text-align:left;margin:5px 0}
#archiveText{white-space:pre-wrap;overflow-wrap:anywhere;max-height:400px;overflow:auto;border-top:1px solid #444;padding:12px 0;user-select:text}
.hidden{display:none!important}.footer{color:#777;text-align:center;font-size:12px;margin-top:28px}
@media(max-width:560px){.writing-surface{height:250px}.writing-display{padding:14px}.controls{grid-template-columns:1fr}.stat strong{font-size:19px}}
</style>
</head>
<body><main class="shell">
<header><h1>FreeFlow</h1><p class="version">Version 0.4.5</p><p class="tagline">A space to write without looking back.</p></header>
<div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
<nav class="nav"><button id="writeTab" aria-pressed="true">Write</button><button id="archiveTab" aria-pressed="false">Archive</button></nav>
<section id="writeView">
<div class="topline"><span id="state">READY</span><span id="timer">Idle timer: —</span><span id="bufferStatus">Visible: 0 / 50</span></div>
<div class="writing-surface" id="writingSurface"><div id="writingDisplay" class="writing-display" aria-hidden="true"></div>
<textarea id="editor" class="editor" disabled spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" aria-label="Forward-only writing"></textarea></div>
<p class="hint" id="hint"></p>
<div class="actions"><button id="beginButton" disabled>Begin Session</button><button id="endButton" disabled>End Session</button><button id="retryButton" class="hidden">Retry Save</button></div>
<div class="stats"><div class="stat"><strong id="chars">0</strong><span>Characters</span></div><div class="stat"><strong id="words">0</strong><span>Words</span></div><div class="stat"><strong id="elapsed">00:00</strong><span>Elapsed</span></div></div>
<div class="settings"><h2>Settings</h2><div class="controls">
<label>Visible buffer: <output id="maxLabel">50</output> characters<input id="maxBuffer" type="range" min="1" max="500" step="1" value="50"></label>
<label>Rollover chunk: <output id="chunkLabel">20</output> characters<input id="chunkSize" type="range" min="1" max="100" step="1" value="20"></label>
<label>Idle timeout: <output id="idleLabel">60</output> seconds<input id="idleSeconds" type="range" min="2" max="120" step="1" value="60"></label>
</div><p id="records" class="hint">Personal records appear after a completed session.</p></div>
</section>
<section id="archiveView" class="archive hidden"><h2>Archive — read only</h2>
<input id="search" placeholder="Search all saved sessions or tags such as !Idea" aria-label="Search saved writing">
<p id="archiveStatus" class="hint"></p><div id="archiveList" class="archive-list"></div>
<div id="pager" class="pager hidden">
<button id="previousPage" type="button">Previous</button>
<div class="pager-center"><input id="pageSlider" type="range" min="1" max="1" step="1" value="1" aria-label="Archive page">
<output id="pageLabel" for="pageSlider">Page 1 of 1</output></div>
<button id="nextPage" type="button">Next</button>
</div>
<div id="archiveText"></div></section>
<p class="footer">Single HTML file · Local text sessions · No server storage · <button id="connect" class="footer-folder" type="button"><span id="folderStatus">Folder: Not connected</span></button></p>
</main>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const editor=$('editor'), display=$('writingDisplay');
const DEFAULTS={maxBuffer:50,chunkSize:20,idleSeconds:60};
let settings={...DEFAULTS}, records={longest:null,mostCharacters:null,totalSessions:0,totalCharacters:0};
let folder=null, sessionsFolder=null, sessionFile=null, sessionName='', phase='READY', view='write';
let text='', committedLength=0, visual=[], visibleStart=0, startedAt=0, expiredAt=0, deadline=0, remaining=0, lastText='';
let saveBusy=false, dirty=false, saveError=null, ending=false, settingsBusy=false, settingsDirty=false;
let filesCache=[], archiveMatches=[], archivePage=1, archiveRenderId=0;
const PAGE_SIZE=10;
const ALPHABET='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
const randomChar=c=>/\s/u.test(c)?c:ALPHABET[Math.floor(Math.random()*ALPHABET.length)];
const fmt=ms=>{let n=Math.max(0,Math.floor(ms/1000));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');};
const words=s=>(s.trim().match(/\S+/gu)||[]).length;
const stamp=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+String(d.getSeconds()).padStart(2,'0');
function message(s){
 const notice=$('notice');notice.textContent=s;
 // Routine connection/save confirmations belong in the footer, not a banner.
 const isProblem=/failed|error|cannot|not granted|not writable|reconnect folder|use a current|permission/i.test(s);
 notice.classList.toggle('hidden',!isProblem);
}
function displayWriting(){
 const fragment=document.createDocumentFragment();
 if(phase==='ACTIVE'||phase==='ERROR'||phase==='ENDING'){
   const node=document.createElement('span');
   node.textContent=visual.map(c=>c.hidden?c.mask:c.char).join('');
   fragment.appendChild(node);
   if(phase==='ACTIVE'){const caret=document.createElement('span');caret.className='caret';fragment.appendChild(caret);}
 }else{
   const node=document.createElement('span');node.className='placeholder';
   node.textContent=phase==='EXPIRED'?'EXPIRED — Press Enter to begin again…':'Press Enter to begin a session…';
   fragment.appendChild(node);
 }
 display.replaceChildren(fragment);display.scrollTop=display.scrollHeight;
}
function addVisual(s){
 for(const char of s)visual.push({char,hidden:false,mask:null});
 if(visual.length>6000){
   const cut=visual.length-3000;
   const newline=visual.findIndex((c,i)=>i>=cut&&c.char==='\n');
   const n=newline<0?cut:newline+1;
   visual.splice(0,n);visibleStart=Math.max(0,visibleStart-n);
 }
}
function maskOld(n){
 let done=0;
 for(let i=visibleStart;i<visual.length&&done<n;i++){
   if(!visual[i].hidden){visual[i].hidden=true;visual[i].mask=randomChar(visual[i].char);done++;}
   visibleStart=i+1;
 }
}
function render(){
 $('state').textContent=phase;
 $('timer').textContent=phase==='ACTIVE'?'Idle timer: '+Math.ceil(remaining/1000)+'s':phase==='EXPIRED'?'Idle timer: EXPIRED':'Idle timer: —';
 $('bufferStatus').textContent='Visible: '+editor.value.length+' / '+settings.maxBuffer;
 $('chars').textContent=text.length.toLocaleString();$('words').textContent=words(text).toLocaleString();
 $('elapsed').textContent=fmt(phase==='READY'?0:(phase==='EXPIRED'?expiredAt:Date.now())-startedAt);
 $('folderStatus').textContent=folder?'Folder: '+folder.name:'Folder: Not connected';
 $('connect').disabled=['ACTIVE','ERROR','ENDING'].includes(phase);
 $('beginButton').disabled=!folder||!['READY','EXPIRED'].includes(phase);
 $('beginButton').textContent=phase==='EXPIRED'?'New Session':'Begin Session';
 $('endButton').disabled=phase!=='ACTIVE';
 $('retryButton').classList.toggle('hidden',phase!=='ERROR');
 $('archiveTab').disabled=['ACTIVE','ERROR','ENDING'].includes(phase);
 $('writeTab').setAttribute('aria-pressed',String(view==='write'));
 $('archiveTab').setAttribute('aria-pressed',String(view==='archive'));
 $('writeView').classList.toggle('hidden',view!=='write');$('archiveView').classList.toggle('hidden',view!=='archive');
 editor.disabled=phase!=='ACTIVE';
 $('hint').textContent=phase==='ACTIVE'?'Forward-only. Enter adds two line breaks and clears the buffer; Enter again on an empty buffer ends the session.':phase==='ERROR'?'Saving failed. Your complete writing is still in memory. Retry before leaving.':phase==='ENDING'?'Finishing and saving session…':phase==='EXPIRED'?'Final statistics are frozen. Enter begins a new session.':'Select a writable folder, then press Enter or Begin Session.';
 $('maxLabel').textContent=settings.maxBuffer;$('chunkLabel').textContent=settings.chunkSize;$('idleLabel').textContent=settings.idleSeconds;
 $('records').textContent='Best characters: '+(records.mostCharacters?records.mostCharacters.value.toLocaleString()+' ('+records.mostCharacters.date+')':'—')+' · Longest: '+(records.longest?fmt(records.longest.value)+' ('+records.longest.date+')':'—')+' · Sessions: '+records.totalSessions;
 displayWriting();
}
function caretEnd(){if(phase==='ACTIVE'){let n=editor.value.length;editor.setSelectionRange(n,n);}}
function focusEditor(){if(phase==='ACTIVE'&&view==='write'&&document.hasFocus()){editor.focus({preventScroll:true});caretEnd();}}
function idb(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open('freeflow-folder-v1',1);
  request.onupgradeneeded=()=>request.result.createObjectStore('handles');
  request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);
 });
}
async function rememberFolder(handle){
 const db=await idb();
 await new Promise((resolve,reject)=>{
  const tx=db.transaction('handles','readwrite');
  tx.objectStore('handles').put(handle,'folder');
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
 });db.close();
}
async function previousFolder(){
 const db=await idb();
 const result=await new Promise((resolve,reject)=>{
  const tx=db.transaction('handles','readonly');
  const req=tx.objectStore('handles').get('folder');
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });db.close();return result;
}
async function verifyFolder(handle,ask){
 const permission={mode:'readwrite'};
 let status=await handle.queryPermission(permission);
 if(status!=='granted'&&ask)status=await handle.requestPermission(permission);
 if(status!=='granted')return false;
 // Actually test writing, not just a permission flag.
 const probe=await handle.getFileHandle('.freeflow-write-test.tmp',{create:true});
 const stream=await probe.createWritable();await stream.write('ok');await stream.close();
 await handle.removeEntry('.freeflow-write-test.tmp');
 return true;
}
async function loadRecords(){
 try{
  const file=await folder.getFileHandle('records.json');
  const parsed=JSON.parse(await (await file.getFile()).text());
  if(parsed.settings)settings={...DEFAULTS,...parsed.settings};
  if(parsed.records)records={...records,...parsed.records};
 }catch(e){if(e.name!=='NotFoundError')throw e;}
 for(const id of ['maxBuffer','chunkSize','idleSeconds'])$(id).value=settings[id];
}
async function writeRecords(){
 if(!folder)return;
 const file=await folder.getFileHandle('records.json',{create:true});
 const stream=await file.createWritable();
 try{await stream.write(JSON.stringify({version:1,settings,records},null,2)+'\n');await stream.close();}
 catch(e){try{await stream.abort();}catch(_){}throw e;}
}
async function queueRecords(){
 settingsDirty=true;
 if(settingsBusy)return;
 settingsBusy=true;
 try{
  while(settingsDirty&&folder){settingsDirty=false;await writeRecords();}
 }catch(e){message('Settings/records save failed: '+e.message);}
 finally{settingsBusy=false;}
}
async function connect(){
 if(!window.showDirectoryPicker){message('Use a current desktop Chrome or Edge browser over HTTPS or localhost.');return;}
 try{
  const handle=await window.showDirectoryPicker({mode:'readwrite'});
  if(!await verifyFolder(handle,true))throw Error('Write permission was not granted.');
  folder=handle;sessionsFolder=await folder.getDirectoryHandle('Sessions',{create:true});
  await loadRecords();await rememberFolder(handle);
  message('Connected to '+handle.name+'. Sessions and records will be saved locally.');
  render();
 }catch(e){if(e.name!=='AbortError')message('Folder connection failed: '+e.message);}
}
async function reconnect(){
 try{
  const handle=await previousFolder();if(!handle)return;
  // Do not request permission on page load: browsers require user interaction.
  if(!await verifyFolder(handle,false)){message('Previously selected folder found. Click Choose / Reconnect Folder to grant access.');return;}
  folder=handle;sessionsFolder=await folder.getDirectoryHandle('Sessions',{create:true});
  await loadRecords();message('Reconnected to '+handle.name);render();
 }catch(e){message('Reconnect folder to continue: '+e.message);}
}
async function begin(){
 if(!folder||!['READY','EXPIRED'].includes(phase))return;
 $('beginButton').disabled=true;
 try{
  if(!await verifyFolder(folder,true))throw Error('Folder is not writable.');
  const now=new Date();
  let base=stamp(now),candidate=base+'.txt',i=1;
  // Never overwrite an existing session with the same timestamp.
  while(true){try{await sessionsFolder.getFileHandle(candidate);candidate=base+'_'+i+++'.txt';}
    catch(e){if(e.name==='NotFoundError')break;throw e;}}
  sessionFile=await sessionsFolder.getFileHandle(candidate,{create:true});
  const writable=await sessionFile.createWritable();await writable.write('');await writable.close();
  sessionName=candidate;text='';committedLength=0;visual=[];visibleStart=0;lastText='';editor.value='';
  saveError=null;dirty=false;ending=false;startedAt=Date.now();expiredAt=0;
  deadline=Date.now()+settings.idleSeconds*1000;remaining=settings.idleSeconds*1000;
  phase='ACTIVE';view='write';message('Writing to Sessions/'+candidate);render();focusEditor();
 }catch(e){message('Cannot begin: '+e.message);render();}
}
function rollover(){
 while(editor.value.length>settings.maxBuffer){
  const amount=Math.min(settings.chunkSize,editor.value.length);
  committedLength+=amount;maskOld(amount);
  editor.value=editor.value.slice(amount);
  dirty=true;
 }
 lastText=editor.value;
}
async function saveSession(){
 if(saveBusy||!sessionFile)return;
 saveBusy=true;
 try{
  while(dirty){
   dirty=false;
   // Rewriting the complete current session is deliberate: File System Access
   // createWritable() is atomic-on-close, not an append stream. Never lose a
   // previously saved prefix, even with a 1-character rollover.
   const snapshot=text;
   const stream=await sessionFile.createWritable({keepExistingData:false});
   try{await stream.write(snapshot);await stream.close();}
   catch(e){try{await stream.abort();}catch(_){}throw e;}
  }
  if(ending)await finish();
 }catch(e){
  dirty=true;saveError=e;phase='ERROR';ending=false;
  message('SAVE FAILED: '+e.message+' — writing paused; text retained in memory.');
  render();
 }finally{saveBusy=false;}
}
function scheduleSave(){dirty=true;void saveSession();}
async function retry(){
 if(phase!=='ERROR')return;
 try{
  if(!await verifyFolder(folder,true))throw Error('Write access not granted.');
  saveError=null;phase='ENDING';ending=true;render();
  scheduleSave();
 }catch(e){message('Retry failed: '+e.message);}
}
async function finish(){
 if(!ending||dirty)return;
 // Called only after the session snapshot is successfully closed.
 expiredAt=Date.now();ending=false;phase='EXPIRED';editor.value='';visual=[];visibleStart=0;
 const date=new Date(startedAt).toLocaleString(),duration=expiredAt-startedAt;
 records.totalSessions++;records.totalCharacters+=text.length;
 if(!records.mostCharacters||text.length>records.mostCharacters.value)records.mostCharacters={value:text.length,date};
 if(!records.longest||duration>records.longest.value)records.longest={value:duration,date};
 await queueRecords();
 message('Session saved: Sessions/'+sessionName+'. Press Enter to begin again.');
 render();
}
function expire(){
 if(phase!=='ACTIVE')return;
 // Finish via the same safe save path for timeout, empty Enter, and End Session.
 committedLength=text.length;editor.value='';lastText='';phase='ENDING';ending=true;
 dirty=true;render();void saveSession();
}
editor.addEventListener('beforeinput',e=>{
 if(phase!=='ACTIVE'){e.preventDefault();return;}
 if(!['insertText','insertCompositionText'].includes(e.inputType)){e.preventDefault();return;}
 caretEnd();
});
editor.addEventListener('input',()=>{
 if(phase!=='ACTIVE')return;
 if(!editor.value.startsWith(lastText)){editor.value=lastText;caretEnd();return;}
 const added=editor.value.slice(lastText.length);
 if(added){text+=added;addVisual(added);rollover();deadline=Date.now()+settings.idleSeconds*1000;remaining=settings.idleSeconds*1000;render();if(dirty)void saveSession();}
 caretEnd();
});
editor.addEventListener('keydown',e=>{
 if(phase!=='ACTIVE')return;
 if(e.key==='Enter'){e.preventDefault();if(!e.repeat&&!e.isComposing){
  if(editor.value.length===0){
   // The second Enter, with no new text since the prior commit, ends the session.
   expire();
  }else{
   // A forced save separates writing segments with exactly two line feeds.
   text+='\n\n';committedLength=text.length;
   editor.value='';lastText='';visual=[];visibleStart=0;
   deadline=Date.now()+settings.idleSeconds*1000;remaining=settings.idleSeconds*1000;
   scheduleSave();render();
  }
 }return;}
 if(['Backspace','Delete','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown','Insert'].includes(e.key)||e.ctrlKey||e.metaKey||(e.altKey&&!e.getModifierState('AltGraph'))){e.preventDefault();return;}
 caretEnd();
});
for(const type of ['paste','drop','dragstart','cut','copy'])editor.addEventListener(type,e=>e.preventDefault());
for(const type of ['select','mouseup','focus','touchend'])editor.addEventListener(type,caretEnd);
$('writingSurface').addEventListener('click',focusEditor);
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!e.repeat&&!e.isComposing&&['READY','EXPIRED'].includes(phase)&&view==='write'&&!['BUTTON','INPUT'].includes(document.activeElement.tagName)){e.preventDefault();void begin();}
});
$('beginButton').addEventListener('click',()=>void begin());
$('endButton').addEventListener('click',expire);
$('retryButton').addEventListener('click',()=>void retry());
$('connect').addEventListener('click',()=>void connect());
$('writeTab').addEventListener('click',()=>{view='write';render();});
$('archiveTab').addEventListener('click',()=>{if(['READY','EXPIRED'].includes(phase)){view='archive';render();void loadArchive();}});
function settingsChanged(){
 for(const id of ['maxBuffer','chunkSize','idleSeconds'])settings[id]=+$(id).value;
 if(phase==='ACTIVE'){
  rollover();deadline=Date.now()+settings.idleSeconds*1000;remaining=settings.idleSeconds*1000;
  if(dirty)void saveSession();
 }
 render();void queueRecords();
}
for(const id of ['maxBuffer','chunkSize','idleSeconds']){
 $(id).addEventListener('input',settingsChanged);
 $(id).addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'].includes(e.key))focusEditor();});
}
document.addEventListener('pointerup',()=>{if(phase==='ACTIVE')setTimeout(focusEditor,0);});
async function loadArchive(){
 if(!sessionsFolder)return;
 $('archiveStatus').textContent='Loading sessions…';
 try{
  const files=[];
  for await(const [name,handle] of sessionsFolder.entries()){
   if(handle.kind==='file'&&name.endsWith('.txt'))files.push({name,handle});
  }
  files.sort((a,b)=>b.name.localeCompare(a.name));filesCache=files;
  await searchArchive();
 }catch(e){$('archiveStatus').textContent='Archive error: '+e.message;}
}
async function firstLinePreview(entry){
 // Read only the beginning of the file, not the entire session.
 const file=await entry.handle.getFile();
 const chunk=await file.slice(0,4096).text();
 const line=chunk.split(/\r?\n/,1)[0];
 const chars=Array.from(line);
 return chars.slice(0,50).join('')+(chars.length>50?'…':'');
}
function renderArchivePage(){
 const generation=++archiveRenderId;
 const totalPages=Math.max(1,Math.ceil(archiveMatches.length/PAGE_SIZE));
 archivePage=Math.max(1,Math.min(totalPages,archivePage));
 $('pager').classList.toggle('hidden',archiveMatches.length<=PAGE_SIZE);
 $('pageSlider').max=String(totalPages);
 $('pageSlider').value=String(archivePage);
 $('pageLabel').textContent='Page '+archivePage+' of '+totalPages;
 $('previousPage').disabled=archivePage<=1;
 $('nextPage').disabled=archivePage>=totalPages;
 const list=$('archiveList');list.replaceChildren();
 const entries=archiveMatches.slice((archivePage-1)*PAGE_SIZE,archivePage*PAGE_SIZE);
 for(const entry of entries){
  const button=document.createElement('button');button.className='entry';
  const name=document.createElement('span');name.className='entry-name';name.textContent=entry.name;
  const preview=document.createElement('span');preview.className='entry-preview';preview.textContent='Loading preview…';
  const separator=document.createElement('span');separator.textContent=' - ';separator.style.color='var(--muted)';
  button.append(name,separator,preview);
  button.addEventListener('click',async()=>{
   try{$('archiveText').textContent=await (await entry.handle.getFile()).text();}
   catch(e){$('archiveText').textContent='Could not read file: '+e.message;}
  });
  list.appendChild(button);
  void firstLinePreview(entry).then(value=>{
   if(generation===archiveRenderId)preview.textContent=value;
  }).catch(()=>{
   if(generation===archiveRenderId)preview.textContent='Preview unavailable';
  });
 }
}
let archiveSearchId=0;
async function searchArchive(){
 const id=++archiveSearchId;
 const q=$('search').value.toLowerCase().trim(),matches=[];
 $('archiveStatus').textContent='Searching…';
 try{
  for(const entry of filesCache){
   if(id!==archiveSearchId)return;
   if(!q||entry.name.toLowerCase().includes(q)){matches.push(entry);continue;}
   const contents=await (await entry.handle.getFile()).text();
   if(contents.toLowerCase().includes(q))matches.push(entry);
  }
  if(id!==archiveSearchId)return;
  archiveMatches=matches;archivePage=1;
  $('archiveStatus').textContent=matches.length+' of '+filesCache.length+' session(s)';
  $('archiveText').textContent='';
  renderArchivePage();
 }catch(e){if(id===archiveSearchId)$('archiveStatus').textContent='Search error: '+e.message;}
}
$('previousPage').addEventListener('click',()=>{archivePage--;renderArchivePage();});
$('nextPage').addEventListener('click',()=>{archivePage++;renderArchivePage();});
$('pageSlider').addEventListener('input',e=>{archivePage=Number(e.target.value);renderArchivePage();});
let searchGeneration=0;
$('search').addEventListener('input',()=>{const n=++searchGeneration;setTimeout(()=>{if(n===searchGeneration)void searchArchive();},250);});
setInterval(()=>{if(phase==='ACTIVE'){
 remaining=Math.max(0,deadline-Date.now());
 if(remaining===0)expire();else render();
}},150);
window.addEventListener('beforeunload',e=>{
 if(['ACTIVE','ERROR','ENDING'].includes(phase)){e.preventDefault();e.returnValue='';}
});
render();void reconnect();
})();
</script></body></html>
