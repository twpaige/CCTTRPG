
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joshua 1:8 - UK Voice</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 60px auto;
      padding: 20px;
      line-height: 1.7;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      margin-right: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2>Joshua 1:8 (KJV) UK</h2>

  <p id="verse">
    This book of the law shall not depart out of thy mouth;
    but thou shalt meditate therein day and night,
    that thou mayest observe to do according to all
    that is written therein: for then thou shalt make
    thy way prosperous, and then thou shalt have good success.
  </p>

  <button onclick="readVerse()">Read Verse</button>
  <button onclick="stopReading()">Stop</button>

  <script>
    const synth = window.speechSynthesis;
    let voices = [];

    // Load available voices.
    function loadVoices() {
      voices = synth.getVoices();
    }

    loadVoices();

    // Chrome sometimes loads voices asynchronously.
    synth.addEventListener("voiceschanged", loadVoices);

    function readVerse() {
      synth.cancel();

      const text = document.getElementById("verse").innerText;
      const speech = new SpeechSynthesisUtterance(text);

      speech.lang = "en-GB";
      speech.rate = 0.9;
      speech.pitch = 1.0;
      speech.volume = 1.0;

      // Preferred voice.
      const selectedVoice = voices.find(
        v => v.name === "Google UK English Male"
      );

      // Use preferred voice if available.
      if (selectedVoice) {
        speech.voice = selectedVoice;
      }

      synth.speak(speech);
    }

    function stopReading() {
      synth.cancel();
    }
  </script>

</body>
</html>
