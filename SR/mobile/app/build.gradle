plugins { id 'com.android.application' }

def ciVersionCode = providers.environmentVariable('SR_VERSION_CODE').orElse('1').get().toInteger()
if (ciVersionCode < 1 || ciVersionCode > 2100000000) throw new GradleException('Invalid SR_VERSION_CODE')

android {
    namespace 'com.crownandcall.srproof'
    compileSdk 35
    defaultConfig {
        applicationId 'com.crownandcall.srproof'
        minSdk 26
        targetSdk 35
        versionCode ciVersionCode
        versionName ciVersionCode == 1 ? '0.2.0' : "0.2.${ciVersionCode}"
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/srAssets')
}

// Package the actual shared JavaScript, not a manually maintained Android copy.
tasks.register('prepareWebAssets', Sync) {
    into layout.buildDirectory.dir('generated/srAssets')
    from('../web')
    from('../../poc') { include 'sample.js', 'speech.css'; into 'shared' }
    from('../../js') { include 'playback-plan.js'; into 'shared' }
    from('../../js') { include 'db.js', 'repository.js', 'validation.js', 'backup.js', 'scheduler.js'; into 'js' }
    from('../../data') { into 'data' }
    from('../../poc') { include 'speech.css'; into 'poc' }
}
tasks.named('preBuild').configure { dependsOn 'prepareWebAssets' }
